# nn builds with the Trust toolchain (owner directive 2026-09-28: every ALab
# system builds with Trust). This file only selects the compiler; the lane is
# chosen per command by targo (`targo --unverified <verb>` or `targo trust
# <verb>`), not here. The public snapshot keeps this pin: a public user installs
# aterm, and atpkg installs Trust.
# The earlier stable->trust flip rationale and the 2026-08-30 re-measurement
# notes live in this file at 71592e438ab0.
[toolchain]
channel = "trust"
